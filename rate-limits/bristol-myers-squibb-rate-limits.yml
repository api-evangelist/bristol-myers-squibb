description: >-
  Bristol Myers Squibb documents no API rate limits anywhere on its public surface, and publishes
  no API against which limits could apply. No RateLimit-*, X-RateLimit-* or Retry-After header was
  observed on any response from www.bms.com, api.bms.com, www.bmsmedinfo.com or
  www.bmsclinicaltrials.com.
