notes: >-
  The only published request-rate signal Bristol Myers Squibb serves is a crawl policy, not an API
  limit: investors.bms.com/robots.txt declares `Crawl-delay: 10` for all agents and `Crawl-delay: 60`
  for Eluta.ca. www.bms.com/robots.txt and www.bmsclinicaltrials.com/robots.txt declare Disallow
  rules but no crawl delay. This artifact previously carried a synthetic "Partner / collaboration
  APIs" limit and a backoff policy written by the 2026-05-04 bulk sweep; BMS never published either,
  so both have been removed in favour of an honest limit_count of 0.
