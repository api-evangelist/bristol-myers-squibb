x-coverage:
  state: covered
  reason: no-developer-program
  detail: >-
    Bristol Myers Squibb publishes no API and no developer program: api.bms.com resolves to a CA
    SiteMinder SSO vanity host (smvu.web.bms.com) serving a 29-byte static page and 404s on
    /openapi.json, /graphql, /mcp and every /.well-known/ path, and developer.bms.com does not
    resolve at all. What it does publish is a real first-party open-source surface — 49 repositories
    in github.com/BristolMyersSquibb, 8 of them released to CRAN — so this profile is covered by
    package, conformance and probe artifacts rather than by a contract.
  evidence:
    - url: https://api.bms.com/openapi.json
      status: 404
    - url: https://www.bms.com/.well-known/api-catalog
      status: 404
    - url: https://cran.r-project.org/package=blockr.core
      status: 200
  checked: '2026-09-04'
