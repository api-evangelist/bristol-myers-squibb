description: >-
  Bristol Myers Squibb (BMS) is a global Fortune 500 biopharmaceutical company
  committed to discovering, developing, and delivering innovative medicines for
  patients with serious diseases. BMS focuses on oncology, immunology, cardiovascular,
  fibrosis, and cell therapy (CAR T). The company operates BMS Study Connect for
  clinical trial recruitment, a Medical Information portal for healthcare providers,
  and the BMS Business Development platform for research partnerships and data
  sharing. BMS actively pursues technology partnerships in protein degradation,
  advanced treatment modalities, and digital health.
apis:
  - aid: bristol-myers-squibb:medical-information-api
    name: BMS Medical Information Portal
    tags:
      - Medical Information
      - Healthcare Providers
      - Clinical Data
    humanURL: https://www.bmsmedinfo.com/
    properties:
      - url: https://www.bmsmedinfo.com/
        type: Portal
      - url: https://www.bmsmedinfo.com/prescribing-information.html
        type: x-PrescribingInformation
      - url: https://www.bmsmedinfo.com/submit-medical-inquiry.html
        type: x-MedicalInquiry
    description: >-
      BMS Medical Information Online provides US healthcare providers with prescribing
      information, medical inquiry submission, and product/regimen libraries for BMS
      medicines across oncology, hematology, immunology, cardiovascular and neuroscience
      (ABECMA, BREYANZI, CAMZYOS, COBENFY, ELIQUIS, OPDIVO, ORENCIA, REBLOZYL, REVLIMID,
      SOTYKTU, YERVOY and others). It is an Adobe Experience Manager web application with
      no published API: probed 2026-09-04, /openapi.json, /swagger.json, /graphql, /api and
      every /.well-known/ path returned 404 or a redirect to the site 404 page. The
      previously recorded humanURL, www.bms.com/healthcare-providers/medical-information.html,
      now returns HTTP 404 and has been replaced with the live portal host.
  - aid: bristol-myers-squibb:study-connect
    name: BMS Study Connect
    tags:
      - Clinical Trials
      - Patient Recruitment
      - Research
    humanURL: https://www.bmsclinicaltrials.com/us/en
    properties:
      - url: https://www.bmsclinicaltrials.com/us/en
        type: Portal
      - url: https://www.bms.com/research-and-development/clinical-trials.html
        type: x-ClinicalTrials
    description: >-
      BMS Clinical Trials is the clinical trial search and enrollment platform for
      patients and caregivers looking for Bristol Myers Squibb sponsored studies. It was
      formerly published as BMS Study Connect; www.bmsstudyconnect.com now 301s to
      www.bmsclinicaltrials.com/us/en. It is an Adobe Experience Manager web application
      with no published API. Machine-readable data about BMS-sponsored trials is available,
      but from NIH rather than from BMS: the ClinicalTrials.gov v2 API returned
      totalCount 2931 for query.spons=Bristol-Myers Squibb on 2026-09-04.
