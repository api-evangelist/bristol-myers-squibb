description: >-
  Bristol Myers Squibb publishes no API plans, no developer tiers and no price list, because it
  publishes no API. Its public programmatic-adjacent surfaces — the Medical Information Online
  portal (www.bmsmedinfo.com), BMS Clinical Trials (www.bmsclinicaltrials.com, formerly BMS Study
  Connect) and the partnerships / business development front door — are human web applications and
  contact forms, not priced products. Independent-researcher access to clinical trial data is not
  sold at all: it is applied for through the Vivli platform under the PhRMA/EFPIA data-sharing
  principles.
