summary: 'Bristol Myers Squibb publishes NO API client SDKs, because it publishes no API. It does publish a substantial
  first-party open-source software surface: the ''blockr'' R framework — a block-based, no-code UI for data manipulation
  and visualization aimed at clinical-trial data work — across 49 public repositories in github.com/BristolMyersSquibb,
  of which 8 are released on CRAN and 8 are served from the company''s own r-universe registry. These are development
  tools, NOT client libraries for a Bristol Myers Squibb API, so no `SDKs` pointer is emitted for them; recording
  them as SDKs would credit the company with an API surface it does not have.'
