registries_note: npm, PyPI, RubyGems, crates.io, Packagist, Maven Central, NuGet and pkg.go.dev were checked for
  a first-party Bristol Myers Squibb client library and returned nothing first-party. blockr.admiral and blockr-site
  carry JavaScript build tooling only and publish no package.
