summary: Bristol Myers Squibb ships no MCP server, hosted or local. /mcp 404s on every BMS host. The closest
  thing in the company's public code is blockr.assistant, a Shiny dock extension that exposes in-process
  LLM tools (list_blocks, describe_block, query_data, add_block, modify_block) through the R `ellmer`
  package — it is an in-app tool surface for a desktop/Shiny session, not an MCP server, and it is deliberately
  NOT recorded as one here.
tools: []
note: No candidate tool list was derived, because there is no OpenAPI to derive one from. Emitting a fabricated
  endpoint or an invented tool list would read as a verified agent surface; recording the absence is the
  honest result. No MCPServer pointer is wired into apis.yml.
